<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criacao</title>
    <link rel="stylesheet" href="css/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atomic+Age&display=swap" rel="stylesheet">
</head>
<body>

    <meu-header></meu-header>
    <meu-nav></meu-nav>


    <main>
        <h2>Gerenciador de Avisos (CRUD)</h2>
        <h3>Criar Aviso</h3>
        <div id="mensagem">Preencha os dados para criar um novo aviso.</div>
        
        <!-- Formulário para Criar -->
        <form id="avisoForm">    
            <input type="hidden" id="avisoId">
            <input type="text" id="avisoTitle" placeholder="Aviso" required>
            <button type="submit" id="submitBtn">Criar aviso</button>
        </form>

        <div id="avisosContainer">   
        </div>

    </main>
    
    <meu-footer></meu-footer>


    <script type="module" src="js/criar2.js"></script>
    <script src="js/components.js"></script>

</body>
